<!DOCTYPE html>
<html>
    <head>
        <title>Food Facts</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            body {
                background-color: #f8f9fa;
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 50px;
            }
            h1 {
                color: #ff6347;
            }
            p {
                margin: 20px 0;
            }
            blockquote {
                font-style: italic;
                color: #555;
                border-left: 5px solid #ff6347;
                padding-left: 15px;
            }
            </style>
    </head>
    <body>
        <h1>
            Food Facts
        </h1>
        <p class="display-1">This Is The Food Show</p>
        <p class="display-2">Food Facts Time</p>
        <p class="display-3">Pepperoni Pizza</p>
        <p class="display-4">Cheeseburger <small>By Yazen</small></p>
        <p class="display-4">Pizza Is <mark>Loved By</mark> All Kids</p>
        <p class="display-4">I love <abbr title="Barbecue">BBQ</abbr> pizza</p>
        <blockquote class="blockquote">
            <p class="mb-0">Pizza is the best food in the world</p>
          </blockquote>
    </body>
</html>
